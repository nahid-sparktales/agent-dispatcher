name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-15
            python: '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # Do not build first: that would repair stale/missing committed artifacts before testing.
      - name: Run offline test suite
        run: python3 -B -m tests
      - name: Verify regeneration leaves the checkout clean
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

  lint:
    name: Workflow and shell checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate shell scripts
        run: |
          for script in install.sh sources/shared/HOOK.template.sh hooks/agent-dispatcher-activate.sh; do
            bash -n "$script"
          done
          shellcheck install.sh sources/shared/HOOK.template.sh hooks/agent-dispatcher-activate.sh
      - name: Validate workflows with actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  required:
    name: CI passed
    if: always()
    needs: [validate, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every validation job to pass
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: test "$VALIDATE_RESULT" = success && test "$LINT_RESULT" = success
